services:
  - type: web
    name: soq-libya-api
    env: node
    region: frankfurt
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soq-libya-db
          property: connectionString
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: soq-libya-frontend
    env: static
    region: frankfurt
    buildCommand: cd frontend/dashboard && npm install && npm run build
    staticPublishPath: ./frontend/dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://soq-libya-api.onrender.com/api
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false

databases:
  - name: soq-libya-db
    plan: free
    region: frankfurt